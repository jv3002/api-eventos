name: CI/CD Pipeline Cloud Native

# Se ejecutara automaticamente al hacer un push a la rama main
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v3

    - name: Configurar JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compilar el proyecto con Maven
      run: mvn clean package -DskipTests

    - name: Iniciar sesion en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir y subir la imagen a Docker Hub
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/api-eventos:latest

    - name: Desplegar en la instancia EC2 de AWS
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/api-eventos:latest
          docker stop api-eventos || true
          docker rm api-eventos || true
          docker run -d -p 8080:8080 --name api-eventos ${{ secrets.DOCKER_USERNAME }}/api-eventos:latest