# 1. Puerto del servidor
server.port=8080

# 2. Configuración de BD MySQL (Reemplaza a H2)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:api_eventos_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Configuración de Hibernate / JPA para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# update es vital: crea las tablas si no existen, pero NO las borra al reiniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 3. Configuración AWS S3
aws.s3.region=us-east-1
aws.s3.bucket=api-eventos-tickets-jheison-2026