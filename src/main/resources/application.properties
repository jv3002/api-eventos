# 1. Puerto del servidor
server.port=8080

# 2. Configuración de BD en memoria H2 (Para que CompraRepository funcione)
spring.datasource.url=jdbc:h2:mem:eventosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# 3. Configuración AWS S3 (Para que S3Config funcione)
aws.s3.region=us-east-1
aws.s3.bucket=JHEISON_VERA_ZUNIGA